<div class="orders-container">
  <h2>Orders List</h2>
  <table class="orders-table" *ngIf="orders.length > 0; else noOrders">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.customer }}</td>
        <td>${{ order.amount }}</td>
        <td>{{ order.status }}</td>
        <td>{{ order.date }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #noOrders>
    <p>No orders found.</p>
  </ng-template>
</div>
